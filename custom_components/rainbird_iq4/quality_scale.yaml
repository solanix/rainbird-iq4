rules:
  # Bronze
  action-setup: done
  appropriate-polling:
    status: done
    comment: Cloud metadata 5 min; local realtime 30 s idle / 10 s running; local slow 5 min.
  brands:
    status: todo
    comment: Custom integration; needs icon/logo (brands repo or local brand images) before release.
  common-modules: done
  config-flow-test-coverage:
    status: done
    comment: tests_ha/test_config_flow.py against real Home Assistant.
  config-flow:
    status: done
    comment: All config, reauth and options fields have data_description.
  dependency-transparency:
    status: todo
    comment: pyrainbird-iq4 is unpublished; manifest requirements is empty.
  docs-actions:
    status: todo
    comment: Only developer docs (docs/reference/HA_INTERFACE.md); no user-facing documentation.
  docs-conditions:
    status: exempt
    comment: No conditions.
  docs-high-level-description: todo
  docs-installation-instructions: todo
  docs-removal-instructions: todo
  docs-triggers:
    status: exempt
    comment: No triggers.
  entity-event-setup:
    status: exempt
    comment: No event subscriptions; coordinators drive updates.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup:
    status: done
    comment: >-
      Cloud first refresh raises ConfigEntryNotReady, except that an entry with local control
      and a saved cloud snapshot loads from the snapshot so local stop stays available (ADR-014).
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: todo
  docs-installation-parameters: todo
  entity-unavailable: done
  integration-owner:
    status: todo
    comment: manifest codeowners is empty.
  log-when-unavailable:
    status: done
    comment: DataUpdateCoordinator logs once on failure and recovery.
  parallel-updates:
    status: done
    comment: PARALLEL_UPDATES = 0 on every platform; all entities are coordinator-based.
  reauthentication-flow: done
  test-coverage:
    status: done
    comment: 96% combined (tests + tests_ha) on 2026-10-10.

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: Controllers are found through the IQ4 cloud account, not network discovery.
  discovery:
    status: exempt
    comment: Controllers are found through the IQ4 cloud account, not network discovery.
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices: todo
  docs-supported-functions: todo
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices:
    status: todo
    comment: >-
      One device per entry, but station, program and runtime entities are created only at setup;
      stations or programs added in IQ4 appear only after a reload.
  entity-category:
    status: done
    comment: Firmware, counts, program summary, controller connected, station metadata and per-station runtimes are diagnostic.
  entity-device-class:
    status: done
    comment: Connectivity, moisture, duration (runtime, rain delay) and enum (irrigation state).
  entity-disabled-by-default:
    status: todo
    comment: >-
      Only disabled stations are disabled by default; per-station program runtime sensors are
      noisy candidates.
  entity-translations:
    status: done
    comment: Station and program entities use IQ4-provided names by design.
  exception-translations:
    status: todo
    comment: Action errors are translated; UpdateFailed and ConfigEntryAuthFailed messages are not.
  icon-translations:
    status: done
    comment: icons.json; connectivity and moisture use device-class icons.
  reconfiguration-flow:
    status: todo
    comment: Local host/PIN are changeable via options; no reconfigure step for the cloud account.
  repair-issues:
    status: exempt
    comment: No user-actionable repair situations identified yet.
  stale-devices:
    status: todo
    comment: >-
      One device per entry, but entities for stations or programs removed in IQ4 remain in the
      registry.

  # Platinum
  async-dependency: done
  inject-websession:
    status: todo
    comment: >-
      Cloud API, config flow and local client use Home Assistant's session; the library's
      authenticate() still opens its own aiohttp session.
  strict-typing:
    status: todo
    comment: mypy is not strict; several sensor constructors take an untyped coordinator.
