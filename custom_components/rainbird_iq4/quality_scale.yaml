rules:
  # Bronze
  action-setup: done
  appropriate-polling:
    status: done
    comment: Cloud metadata 5 min; local realtime 30 s idle / 10 s running; local slow 5 min.
  brands:
    status: todo
    comment: Custom integration; needs icon/logo (brands repo or local brand images) before release.
  common-modules: done
  config-flow-test-coverage:
    status: done
    comment: tests_ha/test_config_flow.py against real Home Assistant.
  config-flow:
    status: todo
    comment: Works and is tested, but strings.json has no data_description for any field.
  dependency-transparency:
    status: todo
    comment: pyrainbird-iq4 is unpublished; manifest requirements is empty.
  docs-actions:
    status: todo
    comment: Only developer docs (docs/reference/HA_INTERFACE.md); no user-facing documentation.
  docs-conditions:
    status: exempt
    comment: No conditions.
  docs-high-level-description: todo
  docs-installation-instructions: todo
  docs-removal-instructions: todo
  docs-triggers:
    status: exempt
    comment: No triggers.
  entity-event-setup:
    status: exempt
    comment: No event subscriptions; coordinators drive updates.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup:
    status: done
    comment: >-
      Cloud first refresh raises ConfigEntryNotReady. This also means an IQ4 cloud outage at
      startup prevents the entry, including local stop, from loading; see setup-without-cloud
      follow-up in docs/development/IMPLEMENTATION_ROADMAP.md.
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: todo
  docs-installation-parameters: todo
  entity-unavailable: done
  integration-owner:
    status: todo
    comment: manifest codeowners is empty.
  log-when-unavailable:
    status: done
    comment: DataUpdateCoordinator logs once on failure and recovery.
  parallel-updates:
    status: todo
    comment: No PARALLEL_UPDATES in any platform; all entities are coordinator-based so 0 is appropriate.
  reauthentication-flow: done
  test-coverage:
    status: done
    comment: 96% combined (tests + tests_ha) on 2026-10-10.

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: Controllers are found through the IQ4 cloud account, not network discovery.
  discovery:
    status: exempt
    comment: Controllers are found through the IQ4 cloud account, not network discovery.
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices: todo
  docs-supported-functions: todo
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices:
    status: todo
    comment: >-
      One device per entry, but station, program and runtime entities are created only at setup;
      stations or programs added in IQ4 appear only after a reload.
  entity-category:
    status: todo
    comment: >-
      Firmware version, station count, programs used, controller connected and station metadata
      should be diagnostic.
  entity-device-class:
    status: todo
    comment: >-
      Durations are set; controller connected (connectivity) and rain sensor (moisture) binary
      sensors have none, and irrigation state could be an enum.
  entity-disabled-by-default:
    status: todo
    comment: >-
      Only disabled stations are disabled by default; per-station program runtime sensors are
      noisy candidates.
  entity-translations:
    status: done
    comment: Station and program entities use IQ4-provided names by design.
  exception-translations:
    status: todo
    comment: Action errors are translated; UpdateFailed and ConfigEntryAuthFailed messages are not.
  icon-translations:
    status: todo
    comment: Icons are set with _attr_icon in code instead of icons.json.
  reconfiguration-flow:
    status: todo
    comment: Local host/PIN are changeable via options; no reconfigure step for the cloud account.
  repair-issues:
    status: exempt
    comment: No user-actionable repair situations identified yet.
  stale-devices:
    status: todo
    comment: >-
      One device per entry, but entities for stations or programs removed in IQ4 remain in the
      registry.

  # Platinum
  async-dependency: done
  inject-websession:
    status: todo
    comment: >-
      Cloud API, config flow and local client use Home Assistant's session; the library's
      authenticate() still opens its own aiohttp session.
  strict-typing:
    status: todo
    comment: mypy is not strict; several sensor constructors take an untyped coordinator.
