[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-rainbird-iq4"
version = "0.1.0"
description = "Home Assistant custom integration for Rain Bird IQ4"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pyrainbird-iq4==0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.30",
    "pytest-cov>=5.0",
    "pytest-homeassistant-custom-component>=0.13.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "homeassistant>=2025.2.0",
]

[tool.uv.sources]
pyrainbird-iq4 = { path = "../pyrainbird-iq4", editable = true }

[tool.setuptools.packages.find]
include = ["custom_components.*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["tests/stubs"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components", "tests"]
known-third-party = ["homeassistant", "pyrainbird_iq4", "pytest", "voluptuous"]

[tool.mypy]
python_version = "3.14"
strict = false
warn_return_any = true
ignore_missing_imports = true
explicit_package_bases = true
files = [
    "custom_components/rainbird_iq4",
    "tests",
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["F401", "F841"]
